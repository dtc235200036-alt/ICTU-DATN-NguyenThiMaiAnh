[project]
name = "ntma-ai-service"
version = "0.1.0"
description = "NTMA AI service - kiem tra trung lap de tai / tai lieu do an (SOA, noi bo)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.54",
    "sqlalchemy==2.0.54",
    "pymysql[rsa]>=1.2",
    "alembic>=1.20",
    "pydantic-settings>=2.15",
    "sentence-transformers",
    "torch",
    "underthesea>=9.5",
    "faiss-cpu>=1.15.1",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "httpx>=0.28",
    "python-docx>=1.2",
    "pymupdf>=1.28",
]

[tool.uv]
# Lock chỉ mang đúng các wheel mà image (python:3.12-slim, linux/amd64) dùng.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
# D-02 / Pitfall A: torch mặc định trên PyPI kéo CUDA runtime — chỉ lấy wheel CPU.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
