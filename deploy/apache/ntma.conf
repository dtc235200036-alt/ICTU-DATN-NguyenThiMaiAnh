ServerName ${SERVER_NAME}
ServerTokens Prod
ServerSignature Off
TraceEnable Off

Listen 443
SSLSessionCache shmcb:/usr/local/apache2/logs/ssl_scache(512000)

<VirtualHost *:80>
    Redirect permanent / https://${SERVER_NAME}:${PUBLIC_HTTPS_PORT}/
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    SSLCertificateFile /usr/local/apache2/conf/certs/server.crt
    SSLCertificateKeyFile /usr/local/apache2/conf/certs/server.key
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    DocumentRoot /usr/local/apache2/htdocs

    # NTMA-01/D-12: giới hạn thân request và timeout proxy (đủ cho upload đề cương/báo cáo ~20MB, NFR-06)
    LimitRequestBody 26214400
    ProxyTimeout 120

    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass /api/ http://api:8001/api/
    ProxyPassReverse /api/ http://api:8001/api/

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "same-origin"

    <Directory /usr/local/apache2/htdocs>
        Options -Indexes
        AllowOverride None
        Require all granted

        FallbackResource /index.html

        Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob:; object-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
    </Directory>

    <Files "index.html">
        Header set Cache-Control "no-cache"
    </Files>
</VirtualHost>
