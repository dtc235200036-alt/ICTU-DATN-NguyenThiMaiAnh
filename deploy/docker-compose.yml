name: ntma

# WR-03: subnet cố định + IP tĩnh cho apache, để api chỉ tin cậy đúng một địa
# chỉ (Apache) qua --forwarded-allow-ips thay vì '*' (tin mọi container có
# thể mở kết nối TCP tới api:8001 trên cùng mạng compose).
networks:
  ntma-internal:
    ipam:
      config:
        - subnet: 172.28.238.0/24

services:
  mysql:
    image: mysql:8.4
    command: >-
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_vietnamese_ci
      --innodb-buffer-pool-size=256M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: thesis_core
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306"
    networks:
      - ntma-internal
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ../backend
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/thesis_core?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET:?}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_MINUTES: ${REFRESH_TOKEN_EXPIRE_MINUTES:-480}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      SEED_ON_START: ${SEED_ON_START:-true}
      SEED_DEFAULT_PASSWORD: ${SEED_DEFAULT_PASSWORD:-}
      # D-07 (Phase 4): Web API gọi dịch vụ AI thật qua mạng nội bộ; đặt
      # AI_CLIENT=stub để quay về bộ giả lập Phase 2/3 (AI_STUB_MODE chỉ có
      # hiệu lực khi AI_CLIENT=stub).
      AI_CLIENT: ${AI_CLIENT:-http}
      AI_SERVICE_URL: http://ai:8002
      AI_API_KEY: ${AI_API_KEY:?}
      AI_STUB_MODE: ${AI_STUB_MODE:-normal}
      APP_ENV: production
      COOKIE_SECURE: "true"
      # WR-03: chỉ tin X-Forwarded-For/-Proto đến từ IP tĩnh của apache bên
      # dưới — phải khớp networks.ntma-internal.apache.ipv4_address.
      FORWARDED_ALLOW_IPS: 172.28.238.10
      # D-02 (Phase 3): thư mục lưu đề cương/báo cáo trên named volume riêng
      # của container api — không nằm dưới DocumentRoot của Apache.
      UPLOAD_DIR: /data/uploads
    depends_on:
      mysql:
        condition: service_healthy
      # UC0.7 E1 / UC1.1 E2: KHÔNG bao giờ service_healthy — Web API phải
      # khởi động và phục vụ được cả khi dịch vụ AI chưa sẵn sàng hoặc lỗi.
      ai:
        condition: service_started
    networks:
      - ntma-internal
    expose:
      - "8001"
    volumes:
      - uploads-data:/data/uploads
      # DATA-03 (04-06): bộ tài liệu thử nghiệm, chỉ đọc — dùng bởi
      # `python -m app.seed_ai_corpus --data /seed-data` (deploy/seed-ai.sh).
      - ../seed-data:/seed-data:ro
    # CR-01 (03-REVIEW): trần bộ nhớ — một upload độc hại chỉ có thể làm
    # container api bị OOM-kill (restart: unless-stopped), không kéo sập host.
    mem_limit: ${API_MEM_LIMIT:-1g}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')"]
      interval: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  # D-07 / §3.2.1: tạo schema thesis_ai + hai tài khoản chỉ quyền trên
  # thesis_ai.* (WR-03: thesis_ai = DML cho tiến trình phục vụ, thesis_ai_migrate
  # = DDL cho ai-migrate; chỉ từ subnet ntma-internal) — one-shot, idempotent.
  ai-db-init:
    image: mysql:8.4
    entrypoint: ["bash", "/init-thesis-ai.sh"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD:?}
      AI_DB_MIGRATE_PASSWORD: ${AI_DB_MIGRATE_PASSWORD:?}
      AI_DB_CLIENT_HOST: "172.28.238.%"
      MYSQL_HOST: mysql
    volumes:
      - ./mysql/init-thesis-ai.sh:/init-thesis-ai.sh:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - ntma-internal
    restart: "no"

  # AISV-01 / D-02 / D-07: dịch vụ AI kiểm tra trùng lặp — CHỈ trên mạng nội
  # bộ (expose, không `ports:`), không có route Apache, mọi endpoint trừ
  # /health đòi X-API-Key. CPU-only, một worker, trần bộ nhớ 2 GiB, trọng số
  # mô hình cache trên volume ai-models (tải trước lúc cài đặt bởi deploy/install.sh — D-02).
  # WR-03: migration thesis_ai chạy một lần bằng tài khoản DDL, trước khi `ai`
  # khởi động bằng tài khoản chỉ có DML (cùng image với `ai`).
  ai-migrate:
    build:
      context: ../ai-service
    image: ntma-ai
    command: ["migrate"]
    environment:
      DATABASE_URL: mysql+pymysql://thesis_ai_migrate:${AI_DB_MIGRATE_PASSWORD:?}@mysql:3306/thesis_ai?charset=utf8mb4
    networks:
      - ntma-internal
    depends_on:
      mysql:
        condition: service_healthy
      ai-db-init:
        condition: service_completed_successfully
    restart: "no"

  ai:
    build:
      context: ../ai-service
    image: ntma-ai
    environment:
      DATABASE_URL: mysql+pymysql://thesis_ai:${AI_DB_PASSWORD:?}@mysql:3306/thesis_ai?charset=utf8mb4
      # WR-03: tài khoản thesis_ai không có DDL — migration do ai-migrate chạy.
      AI_MIGRATE_ON_START: "0"
      AI_API_KEY: ${AI_API_KEY:?}
      # Mô hình chốt sau bake-off (tools/bakeoff/ket-qua.json: chon = bkai).
      AI_MODEL_PROFILE: ${AI_MODEL_PROFILE:-bkai}
      APP_ENV: production
      HF_HOME: /models
      # D-02 (Phase 5): trọng số mô hình được tải trước lúc cài đặt
      # (deploy/install.sh -> python -m app.download_model vào volume
      # ai-models); lúc chạy KHÔNG bao giờ gọi Hugging Face, nên demo không
      # phụ thuộc mạng ngoài. Tải lại thủ công: xem deploy/README.md.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      TORCH_THREADS: ${AI_TORCH_THREADS:-4}
    volumes:
      - ai-models:/models
    # IN-07 (04-REVIEW): hệ thống file gốc chỉ đọc — lỗi thực thi mã trong
    # tiến trình xử lý văn bản không sửa được /app; chỉ /models (volume) và
    # /tmp (tmpfs) ghi được.
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - ntma-internal
    expose:
      - "8002"
    mem_limit: ${AI_MEM_LIMIT:-2g}
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=4); raise SystemExit(0 if json.load(r).get('status') == 'ok' else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      # Nạp mô hình (đã tải sẵn trong volume ai-models) + dựng chỉ mục từ
      # MySQL; rộng tay cho máy yếu.
      start_period: 600s
    depends_on:
      mysql:
        condition: service_healthy
      ai-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  apache:
    build:
      context: ..
      dockerfile: deploy/apache/Dockerfile
    environment:
      SERVER_NAME: ${SERVER_NAME:-localhost}
      PUBLIC_HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./certs:/usr/local/apache2/conf/certs:ro
    networks:
      ntma-internal:
        # WR-03: IP tĩnh — phải khớp FORWARDED_ALLOW_IPS của service api.
        ipv4_address: 172.28.238.10
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
  uploads-data:
  ai-models:
