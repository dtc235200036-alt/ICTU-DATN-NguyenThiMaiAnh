<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:1192px;height:989px;background:#FFFFFF;" width="1192.188px" height="989.063px" viewBox="0 0 1192 989" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><!--class chunk--><g class="entity" data-qualified-name="chunk" id="ent0001" data-source-line="10"><rect x="9.375" y="18.75" width="586.973" height="576.91" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.781;" rx="3.906" ry="3.906"/><text x="271.493" y="49.947" fill="#000" font-size="21.875" textLength="62.737" font-family="'Noto Sans'">chunk</text><line x1="10.938" y1="64.169" x2="594.785" y2="64.169" style="stroke:#181818;stroke-width:0.781;"/><text x="18.75" y="93.803" fill="#000" font-size="21.875" textLength="176.881" font-family="'Noto Sans'">*id : BIGINT «PK»</text><line x1="10.938" y1="106.462" x2="594.785" y2="106.462" style="stroke:#181818;stroke-width:1.563;"/><text x="18.75" y="136.097" fill="#000" font-size="21.875" textLength="402.52" font-family="'Noto Sans'">loai_nguon : VARCHAR(20) «NOT NULL»</text><text x="18.75" y="165.89" fill="#000" font-size="21.875" textLength="568.223" font-family="'Noto Sans'">..CHECK loai_nguon IN ('TOPIC','ARCHIVE','DOCUMENT')</text><text x="18.75" y="195.684" fill="#000" font-size="21.875" textLength="414.901" font-family="'Noto Sans'">— quy ước VARCHAR + CHECK của dự án</text><text x="18.75" y="225.477" fill="#000" font-size="21.875" textLength="470.332" font-family="'Noto Sans'">(thay ENUM, điều chỉnh khi thi công Phase 4)..</text><text x="18.75" y="255.271" fill="#000" font-size="21.875" textLength="335.736" font-family="'Noto Sans'">ma_nguon : BIGINT «NOT NULL»</text><text x="18.75" y="285.065" fill="#000" font-size="21.875" textLength="359.208" font-family="'Noto Sans'">..tham chiếu logic theo loai_nguon:</text><text x="18.75" y="314.858" fill="#000" font-size="21.875" textLength="442.026" font-family="'Noto Sans'">TOPIC → de_tai.id, ARCHIVE → do_an_kho.id,</text><text x="18.75" y="344.652" fill="#000" font-size="21.875" textLength="451.673" font-family="'Noto Sans'">DOCUMENT → tai_lieu_do_an.id (thesis_core)</text><text x="18.75" y="374.445" fill="#000" font-size="21.875" textLength="289.449" font-family="'Noto Sans'">— KHÔNG phải khóa ngoại..</text><text x="18.75" y="404.239" fill="#000" font-size="21.875" textLength="254.558" font-family="'Noto Sans'">thu_tu : INT «NOT NULL»</text><text x="18.75" y="434.033" fill="#000" font-size="21.875" textLength="297.652" font-family="'Noto Sans'">noi_dung : TEXT «NOT NULL»</text><text x="18.75" y="463.826" fill="#000" font-size="21.875" textLength="447.583" font-family="'Noto Sans'">..một câu (chunk mức câu) của tài liệu, hoặc</text><text x="18.75" y="493.62" fill="#000" font-size="21.875" textLength="340.746" font-family="'Noto Sans'">cả tên đề tài với TOPIC/ARCHIVE..</text><text x="18.75" y="523.414" fill="#000" font-size="21.875" textLength="400.005" font-family="'Noto Sans'">bam_noi_dung : CHAR(64) «NOT NULL»</text><text x="18.75" y="553.207" fill="#000" font-size="21.875" textLength="428.573" font-family="'Noto Sans'">..UNIQUE(loai_nguon, ma_nguon, thu_tu);</text><text x="18.75" y="583.001" fill="#000" font-size="21.875" textLength="324.821" font-family="'Noto Sans'">INDEX(loai_nguon, ma_nguon)..</text></g><!--class embedding--><g class="entity" data-qualified-name="embedding" id="ent0002" data-source-line="31"><rect x="89.063" y="684.375" width="428.62" height="278.974" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.781;" rx="3.906" ry="3.906"/><text x="244.321" y="715.572" fill="#000" font-size="21.875" textLength="118.103" font-family="'Noto Sans'">embedding</text><line x1="90.625" y1="729.794" x2="516.12" y2="729.794" style="stroke:#181818;stroke-width:0.781;"/><text x="98.438" y="759.428" fill="#000" font-size="21.875" textLength="